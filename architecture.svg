<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">MovieLens ETL architecture</title>
  <desc id="desc">MovieLens CSV files and the OMDb API feed the Python ETL pipeline. The ETL extracts, transforms and enriches, then loads data into SQLite. The schema defines the tables. SQL queries analyze the database and produce results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526174"/>
    </marker>
    <style>
      .bg { fill: #f7f9fc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .etl { fill: #eef4ff; stroke: #7c9be8; stroke-width: 2; rx: 18; }
      .step { fill: #ffffff; stroke: #b7c7ea; stroke-width: 1.5; rx: 10; }
      .db { fill: #eefbf5; stroke: #67a987; stroke-width: 2; rx: 14; }
      .small { font: 16px 'Segoe UI', Arial, sans-serif; fill: #526174; }
      .label { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #263449; }
      .heading { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #1f2d40; }
      .edge { fill: none; stroke: #526174; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #7b8797; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="440" rx="18"/>

  <!-- Sources -->
  <rect class="card" x="28" y="92" width="210" height="100"/>
  <text class="heading" x="133" y="128" text-anchor="middle">MovieLens CSVs</text>
  <text class="small" x="133" y="158" text-anchor="middle">movies.csv + ratings.csv</text>
  <rect class="card" x="28" y="252" width="210" height="80"/>
  <text class="heading" x="133" y="286" text-anchor="middle">OMDb API</text>
  <text class="small" x="133" y="312" text-anchor="middle">movie details</text>

  <!-- ETL -->
  <rect class="etl" x="300" y="78" width="510" height="262"/>
  <text class="heading" x="555" y="112" text-anchor="middle">Python ETL · etl.py</text>
  <rect class="step" x="322" y="158" width="130" height="94"/>
  <text class="label" x="387" y="197" text-anchor="middle">1. Extract</text>
  <text class="small" x="387" y="224" text-anchor="middle">read + fetch</text>
  <rect class="step" x="480" y="158" width="155" height="94"/>
  <text class="label" x="557" y="197" text-anchor="middle">2. Transform</text>
  <text class="small" x="557" y="224" text-anchor="middle">clean + enrich</text>
  <rect class="step" x="663" y="158" width="125" height="94"/>
  <text class="label" x="725" y="197" text-anchor="middle">3. Load</text>
  <text class="small" x="725" y="224" text-anchor="middle">upsert records</text>
  <path class="edge" d="M452 205 H474"/>
  <path class="edge" d="M635 205 H657"/>

  <!-- Data flow to ETL -->
  <path class="edge" d="M238 142 H274 V184 H316"/>
  <path class="edge" d="M238 292 H274 V226 H474"/>

  <!-- Database and queries -->
  <rect class="db" x="876" y="142" width="170" height="126"/>
  <text class="heading" x="961" y="190" text-anchor="middle">SQLite</text>
  <text class="small" x="961" y="218" text-anchor="middle">movies · genres</text>
  <text class="small" x="961" y="242" text-anchor="middle">ratings · OMDb cache</text>
  <path class="edge" d="M810 205 H870"/>

  <rect class="card" x="1080" y="142" width="170" height="126"/>
  <text class="heading" x="1165" y="190" text-anchor="middle">queries.sql</text>
  <text class="small" x="1165" y="220" text-anchor="middle">analysis queries</text>
  <text class="small" x="1165" y="244" text-anchor="middle">results</text>
  <path class="edge" d="M1046 205 H1074"/>

  <!-- Schema input -->
  <rect class="card" x="500" y="368" width="230" height="52"/>
  <text class="label" x="615" y="401" text-anchor="middle">schema.sql · table design</text>
  <path class="edge-dash" d="M730 394 H961 V274"/>
</svg>

